name: Next.js CI

on:
  pull_request:
  push:
    branches:
      - agent/nextjs15-phase1-newdesign
      - agent/phase2-native-app-router
      - agent/phase3-performance-architecture

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
